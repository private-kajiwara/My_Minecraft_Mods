# =====================================================================
# mods/hyperslice/gradle.properties (Stonecutter included build)
# ---------------------------------------------------------------------
#   Gradle 実行オプション + Mod メタデータ。
#   per-version の依存 (loader/api/java) は stonecutter.properties.toml が
#   正本 (mc-meta/versions.json から生成) で管理する。
#   mod_id / mod_version / maven_group は :common (Groovy) からも
#   rootProject.findProperty(...) で参照されるためここに置く。
# =====================================================================

# JVM / Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom が configuration cache に未対応のため無効化 (Fabric Loom #1349)
org.gradle.configuration-cache=false

# Mod メタデータ
mod_id=hyperslice
mod_version=0.1.0
maven_group=com.kajiwara.hyperslice

# =====================================================================
# slice_count = 4 次元世界を構成するスライス枚数 N (唯一の摘み)
# ---------------------------------------------------------------------
#   この値を変えるだけで下記すべてが追従する:
#     - data/hyperslice/dimension/slice_<i>.json        (N 枚生成)
#     - data/hyperslice/worldgen/biome/slice_<i>.json   (N 枚生成)
#     - 各 dimension JSON に埋まる generator の "slice_count"
#       → HyperSliceChunkGenerator の Codec 経由で HyperTerrain の
#         w 方向周期に流れ込む (Java 側に N の定数は存在しない)
#
#   開発中は 2、 出荷時は 8 を想定。
#   変更後は必ずリビルドすること (生成リソースが作り直される)。
#
#   ※ 既存ワールドの N を変えると w 方向の相関が変わるため、
#     生成済みチャンクと新規チャンクの地形が食い違う。 N を変えたら
#     テストワールドは作り直すこと。
# =====================================================================
slice_count=8
