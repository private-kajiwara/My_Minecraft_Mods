// =====================================================================
// common/build.gradle
// ---------------------------------------------------------------------
//   Minecraft / Fabric API に "直接" 依存しない共有モジュール。
//
//   ここに入れて良いもの:
//     - 4D 座標型 (HyperCoord)
//     - 4D 地形関数 (HyperTerrain) — 全スライス唯一の真実
//     - スライス <-> ディメンション ID の対応 (SliceRegistry)
//
//   ここに入れてはいけないもの:
//     - net.minecraft.* / net.fabricmc.* の import
//     - ChunkGenerator / BlockState / Level を直接触るコード
//
//   "純粋 Java" にしておくと、 Minecraft バージョンが変わっても common を
//   再ビルドする必要が無い (将来 Forge 等への移植時もそのまま再利用できる)。
//   4D 地形関数を MC から隔離することは特に重要で、 地形の同一性を
//   JUnit だけで検証できる (= runClient 無しで周期性・相関を回帰テストできる)。
// =====================================================================

plugins {
    id 'java-library'
}

// mod_version / maven_group は settings.gradle が当 Mod の
// mods/<modid>/gradle.properties から ext として注入する。
version = project.findProperty('mod_version') ?: rootProject.findProperty('mod_version') ?: '0.0.0'
group   = project.findProperty('maven_group') ?: rootProject.findProperty('maven_group') ?: 'com.example'

repositories {
    mavenCentral()
}

dependencies {
    // SLF4J: Minecraft 自体が提供するため compileOnly
    compileOnly 'org.slf4j:slf4j-api:2.0.13'
    compileOnly 'org.jetbrains:annotations:26.0.1'

    // 純粋ロジックの単体テスト (= MC 非依存なので common 内で完結できる)。
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// common は全 MC 世代で共有するため Java 21 固定 (1.21.x=21 / 26.1=25 の両対応)。
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// =====================================================================
// 【診断・使い捨て】 w の微小移動でブロックが何個変わるかの実測
// ---------------------------------------------------------------------
//   ./gradlew :common:wDiff
//
//   出荷 jar には影響しない: 実体は test ソースセット
//   (common/src/test/java/com/kajiwara/hyperslice/diag/) に置いてあり、
//   jar / sourcesJar のどちらにも入らない。
//   捨てるときは diag パッケージとこのタスクを消すだけでよい。
// =====================================================================
tasks.register('wDiff', JavaExec) {
    group = 'diagnostics'
    description = 'w を微小に動かしたときの変化ブロック数を実測する (方式B の設計判断用・出荷物に影響しない)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kajiwara.hyperslice.diag.WDiffProbe'
    // 既定の N は gradle.properties の slice_count に追随させる。
    args = [(project.findProperty('slice_count') ?: rootProject.findProperty('slice_count') ?: '8').toString()]
}
