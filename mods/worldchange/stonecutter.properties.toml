# ---- MC 26.2 (非難読化版・Java25) — buildable:true (held 解除済・versions.json と一致) ----
#   実値は authoritative 確認済み (Fabric Meta / Modrinth)。
#   26.2 はクライアント描画パイプライン破壊的変更 (MultiBufferSource 削除→submit/staged 系・
#   RenderPass/TextureTarget/GpuBufferSlice・setScreenAndShow 等) を版別 //? で本格移植済。
#   dev Iris/Sodium: sodium mc26.2-0.9.0 / iris 1.11.1+26.2。
["26.2"]
deps.fabric_loader = "0.19.3"
deps.fabric_api = "0.152.1+26.2"
deps.mod_menu = "20.0.0-beta.2"
deps.sodium = "mc26.2-0.9.0-fabric"      # dev-only (Iris 1.11.1 が要求・26.2 唯一の Sodium)
deps.iris = "1.11.1+26.2-fabric"          # dev-only
mod.java = "25"
mod.mc_compat = "~26.2"
mod.stable = "true"
mod.recommended = "false"
