# =====================================================================
# stonecutter.properties.toml (Stonecutter centralized + per-node props)
# ---------------------------------------------------------------------
#   正本は mc-meta/versions.json + mc-meta/<MC>.properties。
#   このファイルはそこから生成する想定 (現状は手生成)。
#   build.gradle.kts は sc.properties["deps.*"] で読む。
#
#   注意: Stonecutter は実行時に versions/ ディレクトリを生成するため、
#   Mod のバージョンメタデータは mc-meta/ に退避してある。
#
#   deps.iris / deps.sodium は dev runClient 専用 (modLocalRuntime)。
#   配布 jar・fabric.mod.json・コンパイル classpath には一切混入しない。
#   ノード別に「Iris が required で要求する Sodium」とペアで固定する
#   (ミスマッチは起動クラッシュの原因)。値の出所は Modrinth API 実値。
#   空文字にすればそのノードでは Iris/Sodium を入れない (build.gradle.kts の
#   isNotEmpty() ガードで skip)。Modrinth version_number で記載 (version id も可)。
# =====================================================================

# loom-back-compat が使う Loom バージョン (全ノード共通)
loomx.loom_version = "1.16-SNAPSHOT"

# ---- MC 1.21.10 (旧世代・難読化版・Mojmap・remap Loom・Java21) ----
#   submit/extraction 描画基盤あり (1.21.9+)。 RenderType は旧パッケージ
#   (net.minecraft.client.renderer)・RenderSetup 無し (1.21.11 で導入) のため
#   stonecutter.gradle.kts の <1.21.11 ブリッジ (//? + 一方向置換) で吸収する。
["1.21.10"]
deps.fabric_loader = "0.19.2"
deps.fabric_api = "0.138.4+1.21.10"
deps.mod_menu = "16.0.1"
deps.sodium = "mc1.21.10-0.7.3-fabric"   # dev-only (Iris 1.9.7 が要求)
deps.iris = "1.9.7+1.21.10-fabric"        # dev-only
mod.java = "21"
mod.mc_compat = "1.21.10"
mod.stable = "true"
mod.recommended = "false"

# ---- MC 1.21.11 (旧世代・難読化版・Mojmap・remap Loom・Java21) ----
["1.21.11"]
deps.fabric_loader = "0.19.2"
deps.fabric_api = "0.141.3+1.21.11"
deps.mod_menu = "17.0.0"
deps.sodium = "mc1.21.11-0.8.7-fabric"   # dev-only (Iris 1.10.7 が要求)
deps.iris = "1.10.7+1.21.11-fabric"       # dev-only
mod.java = "21"
mod.mc_compat = "1.21.11"
mod.stable = "true"
mod.recommended = "false"

